<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filament-Lager</title>
<meta name="description" content="Filament-Inventar per Barcode-Scan">
<meta name="theme-color" content="#00857A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filament">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#EEF1F0;
    --surface:#FFFFFF;
    --surface-2:#E3E8E7;
    --border:#D1D7D6;
    --text:#14181A;
    --text-muted:#5B6567;
    --accent:#00857A;
    --accent-contrast:#FFFFFF;
    --warn:#B5790A;
    --danger:#C6432F;
    --ok:#1E8E5A;
    --shadow:0 10px 30px -12px rgba(20,24,26,0.25);
    --radius-s:8px;
    --radius-m:14px;
    --radius-l:22px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181A;
      --surface:#1E2325;
      --surface-2:#262C2E;
      --border:#343B3E;
      --text:#EDEFEF;
      --text-muted:#9AA3A6;
      --accent:#22D6C3;
      --accent-contrast:#06201D;
      --warn:#E8AE4D;
      --danger:#EF6B58;
      --ok:#4FD394;
      --shadow:0 10px 30px -12px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181A;
    --surface:#1E2325;
    --surface-2:#262C2E;
    --border:#343B3E;
    --text:#EDEFEF;
    --text-muted:#9AA3A6;
    --accent:#22D6C3;
    --accent-contrast:#06201D;
    --warn:#E8AE4D;
    --danger:#EF6B58;
    --ok:#4FD394;
    --shadow:0 10px 30px -12px rgba(0,0,0,0.6);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
  .muted{color:var(--text-muted);}
  #app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  @media (min-width:560px){
    #app{
      margin:24px auto;
      min-height:calc(100vh - 48px);
      border-radius:28px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
      overflow:hidden;
    }
  }
  .topbar{
    position:sticky;top:0;z-index:5;
    background:var(--bg);
    border-bottom:1px solid var(--border);
    padding:18px 20px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:10px;
    background:var(--accent);color:var(--accent-contrast);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;flex:none;
  }
  .brand h1{font-size:19px;margin:0 0 2px;font-weight:600;letter-spacing:-0.01em;}
  .brand p{font-size:12.5px;margin:0;}
  .list{
    flex:1;
    padding:16px 16px 110px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-m);
    padding:13px 14px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border-left-width:4px;
    transition:transform .12s ease;
  }
  .card:active{transform:scale(0.985);}
  .swatch{
    width:38px;height:38px;border-radius:10px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:600;color:#fff;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,0.12);
  }
  .card-main{flex:1;min-width:0;}
  .card-title{font-size:14.5px;font-weight:600;margin:0 0 2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-sub{font-size:11.5px;margin:0;letter-spacing:0.01em;}
  .card-qty{text-align:right;flex:none;}
  .card-qty .n{font-size:19px;font-weight:600;line-height:1;}
  .card-qty .l{font-size:10px;letter-spacing:0.03em;}
  .empty{
    margin-top:18vh;text-align:center;padding:0 30px;
  }
  .empty-icon{font-size:38px;margin-bottom:10px;}
  .empty h2{font-size:16px;margin:0 0 6px;}
  .empty p{font-size:13px;margin:0;line-height:1.5;}
  .fab{
    position:fixed;
    left:50%;
    bottom:26px;
    transform:translateX(-50%);
    z-index:20;
    background:var(--accent);
    color:var(--accent-contrast);
    border:none;
    border-radius:999px;
    padding:14px 24px;
    display:flex;align-items:center;gap:9px;
    font-family:inherit;font-size:14.5px;font-weight:600;
    box-shadow:0 8px 22px -6px rgba(0,0,0,0.35);
    cursor:pointer;
  }
  .fab svg{width:19px;height:19px;flex:none;}
  @media (min-width:560px){ .fab{ position:absolute; } }

  .scrim{
    position:fixed;inset:0;background:rgba(10,12,13,0.55);
    z-index:30;
  }
  .hidden{display:none !important;}

  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:40;
    max-width:480px;margin:0 auto;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    border:1px solid var(--border);
    border-bottom:none;
    padding:8px 20px 26px;
    max-height:88vh;overflow-y:auto;
    box-shadow:0 -12px 30px -10px rgba(0,0,0,0.3);
  }
  .sheet-handle{
    width:36px;height:4px;background:var(--border);border-radius:3px;
    margin:8px auto 14px;
  }
  .sheet h2{font-size:17px;margin:0 0 4px;font-weight:600;}
  .sheet .sub{font-size:12.5px;margin:0 0 18px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:500;margin-bottom:6px;color:var(--text-muted);}
  .field input[type=text],.field input[type=number],.field select{
    width:100%;padding:11px 12px;border-radius:var(--radius-s);
    border:1px solid var(--border);background:var(--surface-2);
    color:var(--text);font-family:inherit;font-size:14.5px;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .seg{display:flex;gap:8px;}
  .seg button{
    flex:1;padding:10px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-family:'JetBrains Mono',monospace;
    font-size:13px;cursor:pointer;
  }
  .seg button.active{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  .btn{
    width:100%;padding:13px;border-radius:var(--radius-s);border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-family:inherit;font-weight:600;
    font-size:14.5px;cursor:pointer;
  }
  .btn-primary{background:var(--accent);color:var(--accent-contrast);border-color:var(--accent);}
  .btn-danger{background:transparent;color:var(--danger);border-color:var(--danger);}
  .btn-ghost{background:transparent;}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .btn{flex:1;}
  .barcode-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:999px;
    padding:5px 11px;font-size:12px;margin-bottom:14px;
  }
  .qty-control{display:flex;align-items:center;justify-content:center;gap:20px;margin:18px 0 6px;}
  .qty-control button{
    width:46px;height:46px;border-radius:50%;border:1px solid var(--border);
    background:var(--surface-2);color:var(--text);font-size:20px;cursor:pointer;
  }
  .qty-control .qty-big{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:600;min-width:60px;text-align:center;}

  .overlay{
    position:fixed;inset:0;z-index:50;background:#0A0C0D;
    display:flex;flex-direction:column;
  }
  .overlay-top{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;color:#fff;
  }
  .overlay-top p{margin:0;font-size:14px;font-weight:600;}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,0.12);
    color:#fff;font-size:16px;cursor:pointer;
  }
  .scan-viewport{
    position:relative;flex:1;background:#000;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  #qr-reader{width:100%;height:100%;}
  #qr-reader video{width:100% !important;height:100% !important;object-fit:cover;}
  .scan-frame{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:72%;max-width:280px;aspect-ratio:1.5;
    border:2px solid var(--accent);border-radius:14px;
    box-shadow:0 0 0 2000px rgba(0,0,0,0.45);
    pointer-events:none;
  }
  .scan-hint{
    position:absolute;bottom:16px;left:0;right:0;text-align:center;
    color:#fff;font-size:12.5px;margin:0;padding:0 20px;
  }
  .manual-entry{padding:16px;background:#0A0C0D;}
  .manual-entry label{display:block;color:#B9C0C1;font-size:12px;margin-bottom:8px;}
  .manual-row{display:flex;gap:8px;}
  .manual-row input{
    flex:1;padding:12px;border-radius:var(--radius-s);border:1px solid #333;
    background:#1B1F20;color:#fff;font-family:'JetBrains Mono',monospace;font-size:14px;
  }
  .manual-row button{
    padding:0 18px;border-radius:var(--radius-s);border:none;background:var(--accent);
    color:var(--accent-contrast);font-family:inherit;font-weight:600;cursor:pointer;
  }

  .info-box{
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);
    padding:12px 14px;margin:2px 0 16px;font-size:12.5px;line-height:1.55;
  }
  .info-box .row{margin-top:9px;}
  .info-box .row:first-child{margin-top:0;}
  .info-box .k{color:var(--text-muted);font-size:10.5px;font-weight:600;letter-spacing:0.02em;margin-bottom:2px;}
  .info-box .v{margin:0;}
  .info-box .disclaimer{
    margin-top:10px;padding-top:9px;border-top:1px solid var(--border);
    color:var(--text-muted);font-size:11px;
  }
  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    z-index:60;background:var(--text);color:var(--bg);
    padding:11px 18px;border-radius:999px;font-size:13px;font-weight:500;
    box-shadow:var(--shadow);max-width:90%;text-align:center;
  }
  .install-banner{
    display:flex;align-items:center;gap:10px;
    margin:0 16px 12px;padding:11px 13px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-s);
    font-size:12.5px;
  }
  .install-banner button{
    flex:none;border:none;background:var(--accent);color:var(--accent-contrast);
    padding:8px 12px;border-radius:6px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer;
  }
  .install-banner .close{background:transparent;color:var(--text-muted);padding:6px;font-size:16px;}
</style>
</head>
<body>

<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🧵</div>
      <div>
        <h1>Filament-Lager</h1>
        <p id="summary" class="muted mono">Lade …</p>
      </div>
    </div>
  </header>
  <div id="installBanner" class="install-banner hidden">
    <span>Als App installieren, für schnelleren Zugriff.</span>
    <button id="installBtn">Installieren</button>
    <button id="installClose" class="close">✕</button>
  </div>
  <main id="list" class="list"></main>
  <button id="fab" class="fab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <rect x="3" y="3" width="4" height="18"></rect>
      <rect x="9" y="3" width="1.5" height="18"></rect>
      <rect x="12.5" y="3" width="3" height="18"></rect>
      <rect x="17.5" y="3" width="1.5" height="18"></rect>
      <rect x="20.5" y="3" width="1" height="18"></rect>
    </svg>
    <span>Scannen</span>
  </button>
</div>

<div id="scrim" class="scrim hidden"></div>

<div id="scanOverlay" class="overlay hidden">
  <div class="overlay-top">
    <button id="scanCancel" class="icon-btn">✕</button>
    <p>Verpackung scannen</p>
    <div style="width:36px"></div>
  </div>
  <div class="scan-viewport">
    <div id="qr-reader"></div>
    <div class="scan-frame"></div>
    <p id="scanHint" class="scan-hint">Kamera wird gestartet …</p>
  </div>
  <div class="manual-entry">
    <label for="manualCode">Kein Kamerazugriff? Code manuell eingeben</label>
    <div class="manual-row">
      <input id="manualCode" inputmode="numeric" placeholder="z. B. 4260123456789">
      <button id="manualSubmit">OK</button>
    </div>
  </div>
</div>

<div id="sheetMatch" class="sheet hidden">
  <div class="sheet-handle"></div>
  <h2 id="matchTitle">—</h2>
  <p class="sub" id="matchSub">—</p>
  <div class="qty-control">
    <button id="matchMinus">–</button>
    <div class="qty-big mono" id="matchQty">0</div>
    <button id="matchPlus">+</button>
  </div>
  <p class="muted" style="text-align:center;font-size:12px;margin:0 0 18px;">Spulen im Lager</p>
  <div id="matchMaterialInfo"></div>
  <button class="btn btn-primary" id="matchAddOne">+1 Spule (Wareneingang)</button>
  <div class="btn-row">
    <button class="btn btn-ghost" id="matchDetails">Details bearbeiten</button>
    <button class="btn btn-ghost" id="matchClose">Fertig</button>
  </div>
</div>

<div id="sheetNew" class="sheet hidden">
  <div class="sheet-handle"></div>
  <h2>Neues Material</h2>
  <p class="sub">Dieser Barcode ist noch nicht im Lager erfasst.</p>
  <div class="barcode-chip mono">📦 <span id="newBarcodeLabel">—</span></div>

  <div class="field">
    <label for="fMaterial">Material</label>
    <select id="fMaterial">
      <option value="PLA">PLA</option>
      <option value="PETG">PETG</option>
      <option value="ABS">ABS</option>
      <option value="ASA">ASA</option>
      <option value="TPU">TPU</option>
      <option value="PC">PC</option>
      <option value="PVA">PVA</option>
      <option value="Sonstiges">Sonstiges</option>
    </select>
  </div>
  <div id="newMaterialInfo"></div>
  <div class="field">
    <label for="fFarbe">Farbe</label>
    <input type="text" id="fFarbe" placeholder="z. B. Schwarz, Signalrot …">
  </div>
  <div class="field">
    <label for="fHersteller">Hersteller</label>
    <input type="text" id="fHersteller" placeholder="z. B. Bambu Lab">
  </div>
  <div class="field">
    <label>Durchmesser</label>
    <div class="seg">
      <button type="button" class="seg-dia active" data-v="1.75">1,75 mm</button>
      <button type="button" class="seg-dia" data-v="2.85">2,85 mm</button>
    </div>
  </div>
  <div class="field">
    <label for="fGewicht">Gewicht pro Spule (g)</label>
    <input type="number" id="fGewicht" value="1000" min="0" step="50">
  </div>
  <div class="field">
    <label for="fAnzahl">Anzahl Spulen jetzt einlagern</label>
    <input type="number" id="fAnzahl" value="1" min="1" step="1">
  </div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="newCancel">Abbrechen</button>
    <button class="btn btn-primary" id="newSave">Speichern</button>
  </div>
</div>

<div id="sheetDetail" class="sheet hidden">
  <div class="sheet-handle"></div>
  <h2 id="detailTitle">—</h2>
  <p class="sub" id="detailSub">—</p>
  <div class="field">
    <label>Barcode</label>
    <p class="mono" id="detailBarcode" style="margin:0;font-size:13px;"></p>
  </div>
  <div class="qty-control">
    <button id="detailMinus">–</button>
    <div class="qty-big mono" id="detailQty">0</div>
    <button id="detailPlus">+</button>
  </div>
  <p class="muted" style="text-align:center;font-size:12px;margin:0 0 18px;">Spulen im Lager</p>
  <div id="detailMaterialInfo"></div>
  <div class="btn-row">
    <button class="btn btn-ghost" id="detailClose">Fertig</button>
    <button class="btn btn-danger" id="detailDelete">Löschen</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script>
(function(){
  "use strict";

  // ---------- Farb-Zuordnung ----------
  var COLOR_MAP = [
    ["schwarz","#1B1B1B"],["black","#1B1B1B"],
    ["weiss","#F2F2F2"],["weiß","#F2F2F2"],["white","#F2F2F2"],
    ["silber","#B9BCBF"],["silver","#B9BCBF"],
    ["grau","#84898B"],["gray","#84898B"],["grey","#84898B"],
    ["dunkelblau","#1B3A63"],["navy","#1B3A63"],
    ["hellblau","#6FB4DD"],
    ["blau","#2B5EA9"],["blue","#2B5EA9"],
    ["türkis","#22B5A6"],["turquoise","#22B5A6"],["cyan","#22B5A6"],
    ["dunkelgrün","#1F6B3A"],
    ["grün","#2F8F4E"],["green","#2F8F4E"],
    ["gelb","#F0C419"],["yellow","#F0C419"],
    ["orange","#E2762A"],
    ["rot","#D1342C"],["red","#D1342C"],
    ["pink","#E46F9A"],["rosa","#E46F9A"],
    ["lila","#7A4FAE"],["violett","#7A4FAE"],["purple","#7A4FAE"],
    ["braun","#6B4A2F"],["brown","#6B4A2F"],
    ["beige","#CDBFA0"],
    ["gold","#C9A227"],["bronze","#8C6A3F"],
    ["transparent","#CFE0DC"],["natur","#D8D3C5"],["clear","#CFE0DC"]
  ];
  function colorFor(farbe){
    var f = (farbe||"").toLowerCase();
    for (var i=0;i<COLOR_MAP.length;i++){
      if (f.indexOf(COLOR_MAP[i][0]) !== -1) return COLOR_MAP[i][1];
    }
    return "#6C7678";
  }
  function initialsFor(material, farbe){
    var s = (material||"?").trim();
    return s.slice(0,2).toUpperCase();
  }

  // ---------- Materialsteckbrief (Richtwerte) ----------
  var MATERIAL_INFO = {
    "PLA": {
      erweichung: "ca. 55–60 °C",
      drucktemp: "190–220 °C",
      chemie: "Empfindlich gegenüber Aceton; unempfindlich gegenüber Wasser und verdünnten Laugen",
      hinweis: "Nicht für dauerhafte Wärme- oder UV-Belastung geeignet. Biobasiert (Milchsäure)."
    },
    "PETG": {
      erweichung: "ca. 70–80 °C",
      drucktemp: "220–250 °C",
      chemie: "Gut beständig gegen Wasser, Laugen und viele Säuren; empfindlich gegenüber manchen Lösungsmitteln",
      hinweis: "Zäher und schlagfester als PLA. Lebensmittelecht nur, wenn Hersteller das explizit angibt."
    },
    "ABS": {
      erweichung: "ca. 95–105 °C",
      drucktemp: "230–260 °C",
      chemie: "Beständig gegen verdünnte Säuren/Laugen; löslich in Aceton",
      hinweis: "Warmer, geschlossener Bauraum empfohlen. Dämpfe beim Druck – gut lüften."
    },
    "ASA": {
      erweichung: "ca. 95–100 °C",
      drucktemp: "240–260 °C",
      chemie: "Ähnlich ABS; zusätzlich UV- und witterungsbeständig",
      hinweis: "Gute Wahl für Außeneinsatz und dauerhafte Sonnenbelastung."
    },
    "TPU": {
      erweichung: "ca. 60–80 °C (je nach Shore-Härte)",
      drucktemp: "210–230 °C",
      chemie: "Beständig gegen viele Öle und Fette",
      hinweis: "Flexibles Material – langsamerer Druck und direkter Extruder empfohlen."
    },
    "PC": {
      erweichung: "ca. 110–130 °C",
      drucktemp: "260–300 °C",
      chemie: "Beständig gegen viele Chemikalien; empfindlich gegenüber Laugen und Aceton",
      hinweis: "Sehr schlagfest, aber hygroskopisch – trocken lagern."
    },
    "PVA": {
      erweichung: "ca. 60–65 °C",
      drucktemp: "190–210 °C",
      chemie: "Wasserlöslich",
      hinweis: "Nur als Stützmaterial. Extrem feuchtigkeitsempfindlich, luftdicht lagern."
    }
  };
  function renderMaterialInfo(material){
    var info = MATERIAL_INFO[material];
    if (!info){
      return '<div class="info-box muted">Für „'+escapeHtml(material||"diesen Materialtyp")+'" liegen hier noch keine Richtwerte vor.</div>';
    }
    return '<div class="info-box">'+
      '<div class="row"><div class="k">ERWEICHT AB</div><p class="v">'+info.erweichung+'</p></div>'+
      '<div class="row"><div class="k">DRUCKTEMPERATUR</div><p class="v">'+info.drucktemp+'</p></div>'+
      '<div class="row"><div class="k">CHEMIKALIENBESTÄNDIGKEIT</div><p class="v">'+info.chemie+'</p></div>'+
      '<div class="row"><div class="k">HINWEIS</div><p class="v">'+info.hinweis+'</p></div>'+
      '<p class="disclaimer">Richtwerte – können je nach Hersteller und Rezeptur abweichen. Im Zweifel Herstellerdatenblatt prüfen.</p>'+
    '</div>';
  }

  // ---------- Store (lokal, pro Gerät — Supabase-Anbindung folgt) ----------
  var store = { items:{}, ready:false };
  var listeners = [];
  function notify(){ listeners.forEach(function(fn){ try{ fn(); }catch(e){} }); }
  function onChange(fn){ listeners.push(fn); }

  var LOCAL_KEY = "filament_inventar_v1";
  function loadLocal(){
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY) || "{}"); }
    catch(e){ return {}; }
  }
  function saveLocal(items){
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch(e){}
  }
  store.items = loadLocal();
  store.ready = true;
  store._set = async function(id, data){
    store.items[id] = data; saveLocal(store.items); notify();
  };
  store._update = async function(id, data){
    store.items[id] = Object.assign({}, store.items[id]||{}, data);
    saveLocal(store.items); notify();
  };
  store._delete = async function(id){
    delete store.items[id]; saveLocal(store.items); notify();
  };

  // ---------- Rendering ----------
  var listEl = document.getElementById("list");
  var summaryEl = document.getElementById("summary");

  function render(){
    var ids = Object.keys(store.items);
    if (ids.length === 0){
      summaryEl.textContent = "0 Sorten im Lager";
      listEl.innerHTML =
        '<div class="empty">'+
          '<div class="empty-icon">🧵</div>'+
          '<h2>Noch kein Filament erfasst</h2>'+
          '<p>Scanne die Verpackung einer Spule, um sie ins Lager aufzunehmen.</p>'+
        '</div>';
      return;
    }
    var totalSpulen = 0;
    ids.forEach(function(id){ totalSpulen += (store.items[id].anzahlSpulen||0); });
    summaryEl.textContent = ids.length + (ids.length===1?" Sorte":" Sorten") + " · " + totalSpulen + " Spulen";

    var sorted = ids.slice().sort(function(a,b){
      var ia = store.items[a], ib = store.items[b];
      var ka = (ia.material||"")+(ia.farbe||"");
      var kb = (ib.material||"")+(ib.farbe||"");
      return ka.localeCompare(kb, "de");
    });

    listEl.innerHTML = "";
    sorted.forEach(function(id){
      var it = store.items[id];
      var qty = it.anzahlSpulen || 0;
      var level = qty === 0 ? "var(--danger)" : (qty <= 1 ? "var(--warn)" : "var(--ok)");
      var card = document.createElement("div");
      card.className = "card";
      card.style.borderLeftColor = level;
      card.innerHTML =
        '<div class="swatch" style="background:'+colorFor(it.farbe)+'">'+initialsFor(it.material,it.farbe)+'</div>'+
        '<div class="card-main">'+
          '<p class="card-title">'+escapeHtml(it.material||"?")+' · '+escapeHtml(it.farbe||"—")+'</p>'+
          '<p class="card-sub muted mono">'+escapeHtml(it.hersteller||"unbekannt")+' · '+escapeHtml(it.durchmesser||"–")+' mm</p>'+
        '</div>'+
        '<div class="card-qty">'+
          '<div class="n">'+qty+'</div>'+
          '<div class="l muted">Spulen</div>'+
        '</div>';
      card.addEventListener("click", function(){ openDetail(id); });
      listEl.appendChild(card);
    });
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
  onChange(render);
  render();

  // ---------- Toast ----------
  var toastEl = document.getElementById("toast");
  var toastTimer = null;
  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.add("hidden"); }, 2600);
  }

  // ---------- Scrim / Sheets ----------
  var scrim = document.getElementById("scrim");
  var sheets = ["sheetMatch","sheetNew","sheetDetail"].map(function(id){ return document.getElementById(id); });
  function closeAllSheets(){
    sheets.forEach(function(s){ s.classList.add("hidden"); });
    scrim.classList.add("hidden");
  }
  function openSheet(el){
    closeAllSheets();
    el.classList.remove("hidden");
    scrim.classList.remove("hidden");
  }
  scrim.addEventListener("click", closeAllSheets);

  // ---------- Scan-Overlay ----------
  var scanOverlay = document.getElementById("scanOverlay");
  var scanHint = document.getElementById("scanHint");
  var fab = document.getElementById("fab");
  var scanCancel = document.getElementById("scanCancel");
  var manualInput = document.getElementById("manualCode");
  var manualSubmit = document.getElementById("manualSubmit");
  var html5QrCode = null;
  var scannerRunning = false;

  fab.addEventListener("click", openScanner);
  scanCancel.addEventListener("click", closeScanner);

  function openScanner(){
    scanOverlay.classList.remove("hidden");
    manualInput.value = "";
    startCamera();
  }
  function closeScanner(){
    scanOverlay.classList.add("hidden");
    stopCamera();
  }
  function startCamera(){
    if (typeof Html5Qrcode === "undefined"){
      scanHint.textContent = "Kamera-Bibliothek nicht verfügbar — bitte Code manuell eingeben.";
      return;
    }
    try {
      html5QrCode = new Html5Qrcode("qr-reader");
      var formats = undefined;
      try {
        formats = [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.QR_CODE
        ];
      } catch(e){ formats = undefined; }

      var config = { fps: 10, qrbox: { width: 280, height: 130 }, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };
      if (formats) config.formatsToSupport = formats;

      html5QrCode.start(
        { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
        config,
        function onScan(decodedText){
          if (!scannerRunning) return;
          handleCode(decodedText.trim());
        },
        function onScanFail(){ /* laufendes Rauschen ignorieren */ }
      ).then(function(){
        scannerRunning = true;
        scanHint.textContent = "Verpackung im Rahmen positionieren";
      }).catch(function(err){
        console.warn("Kamera-Start fehlgeschlagen", err);
        scanHint.textContent = "Kein Kamerazugriff — bitte Code manuell eingeben.";
      });
    } catch(e){
      console.warn(e);
      scanHint.textContent = "Kein Kamerazugriff — bitte Code manuell eingeben.";
    }
  }
  function stopCamera(){
    scannerRunning = false;
    if (html5QrCode){
      html5QrCode.stop().then(function(){
        html5QrCode.clear();
        html5QrCode = null;
      }).catch(function(){ html5QrCode = null; });
    }
  }
  manualSubmit.addEventListener("click", function(){
    var v = manualInput.value.trim();
    if (v) handleCode(v);
  });
  manualInput.addEventListener("keydown", function(e){
    if (e.key === "Enter"){ manualSubmit.click(); }
  });

  function handleCode(code){
    closeScanner();
    var existing = store.items[code];
    if (existing){
      openMatchSheet(code, existing);
    } else {
      openNewSheet(code);
    }
  }

  // ---------- Sheet: Treffer ----------
  var sheetMatch = document.getElementById("sheetMatch");
  var matchTitle = document.getElementById("matchTitle");
  var matchSub = document.getElementById("matchSub");
  var matchQty = document.getElementById("matchQty");
  var currentMatchId = null;

  function openMatchSheet(id, it){
    currentMatchId = id;
    matchTitle.textContent = (it.material||"?") + " · " + (it.farbe||"—");
    matchSub.textContent = (it.hersteller||"unbekannt") + " · " + (it.durchmesser||"–") + " mm · " + (it.gewichtProSpule||"?") + " g/Spule";
    matchQty.textContent = it.anzahlSpulen || 0;
    document.getElementById("matchMaterialInfo").innerHTML = renderMaterialInfo(it.material);
    openSheet(sheetMatch);
  }
  document.getElementById("matchAddOne").addEventListener("click", async function(){
    await changeQty(currentMatchId, 1);
    var it = store.items[currentMatchId];
    matchQty.textContent = it.anzahlSpulen || 0;
    toast("Spule hinzugefügt");
  });
  document.getElementById("matchPlus").addEventListener("click", async function(){
    await changeQty(currentMatchId, 1);
    matchQty.textContent = store.items[currentMatchId].anzahlSpulen || 0;
  });
  document.getElementById("matchMinus").addEventListener("click", async function(){
    await changeQty(currentMatchId, -1);
    matchQty.textContent = store.items[currentMatchId].anzahlSpulen || 0;
  });
  document.getElementById("matchDetails").addEventListener("click", function(){
    openDetail(currentMatchId);
  });
  document.getElementById("matchClose").addEventListener("click", closeAllSheets);

  async function changeQty(id, delta){
    var it = store.items[id];
    if (!it) return;
    var next = Math.max(0, (it.anzahlSpulen||0) + delta);
    try {
      await store._update(id, { anzahlSpulen: next, aktualisiertAm: new Date().toISOString() });
    } catch(e){
      console.warn(e);
      toast("Konnte nicht gespeichert werden");
    }
  }

  // ---------- Sheet: Neues Material ----------
  var sheetNew = document.getElementById("sheetNew");
  var newBarcode = null;
  var diaSelected = "1.75";

  function openNewSheet(barcode){
    newBarcode = barcode;
    document.getElementById("newBarcodeLabel").textContent = barcode;
    document.getElementById("fMaterial").value = "PLA";
    document.getElementById("newMaterialInfo").innerHTML = renderMaterialInfo("PLA");
    document.getElementById("fFarbe").value = "";
    document.getElementById("fHersteller").value = "";
    document.getElementById("fGewicht").value = 1000;
    document.getElementById("fAnzahl").value = 1;
    diaSelected = "1.75";
    document.querySelectorAll(".seg-dia").forEach(function(b){
      b.classList.toggle("active", b.dataset.v === "1.75");
    });
    openSheet(sheetNew);
  }
  document.querySelectorAll(".seg-dia").forEach(function(btn){
    btn.addEventListener("click", function(){
      diaSelected = btn.dataset.v;
      document.querySelectorAll(".seg-dia").forEach(function(b){ b.classList.toggle("active", b===btn); });
    });
  });
  document.getElementById("fMaterial").addEventListener("change", function(){
    document.getElementById("newMaterialInfo").innerHTML = renderMaterialInfo(this.value);
  });
  document.getElementById("newCancel").addEventListener("click", closeAllSheets);
  document.getElementById("newSave").addEventListener("click", async function(){
    var material = document.getElementById("fMaterial").value;
    var farbe = document.getElementById("fFarbe").value.trim();
    var hersteller = document.getElementById("fHersteller").value.trim();
    var gewicht = parseInt(document.getElementById("fGewicht").value, 10) || 0;
    var anzahl = parseInt(document.getElementById("fAnzahl").value, 10) || 0;
    var id = newBarcode || ("manual-" + Date.now());
    var data = {
      barcode: newBarcode || null,
      material: material,
      farbe: farbe,
      hersteller: hersteller,
      durchmesser: diaSelected,
      gewichtProSpule: gewicht,
      anzahlSpulen: anzahl,
      erstelltAm: new Date().toISOString(),
      aktualisiertAm: new Date().toISOString()
    };
    try {
      await store._set(id, data);
      closeAllSheets();
      toast("Material angelegt");
    } catch(e){
      console.warn(e);
      toast("Konnte nicht gespeichert werden");
    }
  });

  // ---------- Sheet: Detail ----------
  var sheetDetail = document.getElementById("sheetDetail");
  var currentDetailId = null;
  function openDetail(id){
    var it = store.items[id];
    if (!it) return;
    currentDetailId = id;
    document.getElementById("detailTitle").textContent = (it.material||"?") + " · " + (it.farbe||"—");
    document.getElementById("detailSub").textContent = (it.hersteller||"unbekannt") + " · " + (it.durchmesser||"–") + " mm · " + (it.gewichtProSpule||"?") + " g/Spule";
    document.getElementById("detailBarcode").textContent = it.barcode || id;
    document.getElementById("detailQty").textContent = it.anzahlSpulen || 0;
    document.getElementById("detailMaterialInfo").innerHTML = renderMaterialInfo(it.material);
    openSheet(sheetDetail);
  }
  document.getElementById("detailPlus").addEventListener("click", async function(){
    await changeQty(currentDetailId, 1);
    document.getElementById("detailQty").textContent = store.items[currentDetailId].anzahlSpulen || 0;
  });
  document.getElementById("detailMinus").addEventListener("click", async function(){
    await changeQty(currentDetailId, -1);
    document.getElementById("detailQty").textContent = store.items[currentDetailId].anzahlSpulen || 0;
  });
  document.getElementById("detailClose").addEventListener("click", closeAllSheets);
  document.getElementById("detailDelete").addEventListener("click", async function(){
    if (!confirm("Diesen Materialeintrag wirklich löschen?")) return;
    try {
      await store._delete(currentDetailId);
      closeAllSheets();
      toast("Gelöscht");
    } catch(e){
      console.warn(e);
      toast("Konnte nicht gelöscht werden");
    }
  });

  // ---------- Installations-Hinweis (Android/Chrome) ----------
  var installBanner = document.getElementById("installBanner");
  var installBtn = document.getElementById("installBtn");
  var installClose = document.getElementById("installClose");
  var deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferredPrompt = e;
    if (!localStorage.getItem("install_dismissed")){
      installBanner.classList.remove("hidden");
    }
  });
  installBtn.addEventListener("click", async function(){
    installBanner.classList.add("hidden");
    if (deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    }
  });
  installClose.addEventListener("click", function(){
    installBanner.classList.add("hidden");
    localStorage.setItem("install_dismissed", "1");
  });

  // ---------- Service Worker ----------
  if ("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(e){ console.warn("SW-Registrierung fehlgeschlagen", e); });
    });
  }
})();
</script>
</body>
</html>
